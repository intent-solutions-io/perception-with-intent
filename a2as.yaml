manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: intent-solutions-io/perception-with-intent
    source: https://github.com/intent-solutions-io/perception-with-intent
    branch: main
    commit: "c432cd9a"
    scope: [agent.py, agent_engine_app.py, perception_app/jvp_agent/__init__.py, perception_app/jvp_agent/a2a.py, perception_app/jvp_agent/agent.py,
      perception_app/jvp_agent/tools/__init__.py, perception_app/perception_agent/agents/agent_0_orchestrator/__init__.py,
      perception_app/perception_agent/agents/agent_0_orchestrator/agent.py, perception_app/perception_agent/tools/agent_0_tools.py,
      scripts/run_ingestion_once.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:52:24Z'
    url: https://a2as.org/certified/agents/intent-solutions-io/perception-with-intent
  signatures:
    digest: sha256:xhjiOXHnNAv-ZowXqn2fy7Cai3I801WLEllerMn-c3U
    key: ed25519:HmU21_ivluEeHV37Q8vslPH-weJ0YNRwFklTaVtlWAU
    sig: ed25519:Slfyf-6XgADqJxyClLJZkJl5vmSEMBiKHeKAENJDbLrBLFr7IYJXOnD3cAP2HVAW2PLmQo0uqO9U8qIunq3rDg

agents:
  JVP_AGENT:
    type: instance
    models: [gemini-1.5-pro]
    tools: [echo_command, orchestrate_strategy, vertex_ai_rag_search, PreloadMemoryTool]
    params:
      name: iamjvp-commander
      description: Baseline strategic command agent aligned with the latest ADK + A2A rollout.
      after_agent_callback: add_session_to_memory
  root_agent.0:
    type: instance
    models: [gemini-2.0-flash]
    tools: [start_ingestion_run, finalize_ingestion_run, build_daily_ingestion_plan, run_daily_ingestion]
    params:
      name: perception_orchestrator
      description: Root orchestrator for the Perception With Intent news intelligence workflow.
      instruction: [You are the Editor-in-Chief of Perception With Intent., 'High-level responsibilities:', '- Coordinate
          source harvesting, relevance scoring, brief writing, alerting, validation, and storage.', '- Ensure each ingestion
          run produces a coherent executive brief and consistent Firestore state.', 'When invoked for a daily_ingestion run:',
        1. Start an ingestion run record (run_id)., '2. Execute the full ingestion pipeline which:', '- Harvests fresh articles
          from all enabled sources', '- Scores and filters articles using user topics', '- Produces a concise executive brief',
        '- Curates and enhances the Tech section', '- Validates that articles and brief are structurally valid', '- Persists
          data to Firestore and finalizes the ingestion run', 'If any critical step fails, surface a clear error and mark
          the run as failed.', 'Note: Technology Desk Editor is the first vertical section editor. In future phases,', 'additional
          section editors (Business Desk, Politics Desk, etc.) will be added.']
      instance: root_agent
  root_agent.1:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: perception_orchestrator
      description: Root orchestrator for the Perception With Intent news intelligence workflow.
      instruction: [You are the Editor-in-Chief of Perception With Intent., 'High-level responsibilities:', '- Coordinate
          source harvesting, relevance scoring, brief writing, alerting, validation, and storage.', '- Ensure each ingestion
          run produces a coherent executive brief and consistent Firestore state.', 'When invoked for a daily_ingestion run:',
        1. Start an ingestion run record (run_id)., 2. Ask Source Harvester for fresh articles from all enabled sources.,
        3. Ask Relevance & Ranking to score and filter articles using user topics., 4. Ask Brief Writer to produce a concise
          executive brief., 5. Ask Technology Desk Editor to curate and enhance the Tech section., 6. Ask Alert & Anomaly
          Detector whether any alerts should fire., 7. Ask Validator to confirm that articles and brief are structurally valid.,
        8. Ask Storage Manager to persist data to Firestore and finalize the ingestion run., 'If any critical step fails,
          surface a clear error and mark the run as failed.', 'Note: Technology Desk Editor is the first vertical section
          editor. In future phases,', 'additional section editors (Business Desk, Politics Desk, etc.) will be added.']
      function: create_agent
      instance: root_agent

models:
  gemini-1.5-pro:
    type: literal
    agents: [JVP_AGENT]
  gemini-2.0-flash:
    type: literal
    agents: [root_agent.1, root_agent.0]

tools:
  build_daily_ingestion_plan:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Stub: Build a high-level plan for a daily ingestion run.

        This will eventually:
        - Read sources from Firestore.
        - Read topics for the given user (or default topics).
        - Decide which sub-agents to invoke and in what order.

        Args:
            user_id: Optional user whose topics should be used.

        Returns:
            A dict describing the plan (for debugging/telemetry).
  echo_command:
    type: function
    agents: [JVP_AGENT]
  finalize_ingestion_run:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Produce a final ingestion run status payload.

        Args:
            run_id: ID of the ingestion run.
            success: Whether the run completed successfully.
            stats: Optional dictionary of counts/metrics
                   (e.g., articles_ingested, articles_selected, alerts_triggered).

        Returns:
            A dict representing the final ingestion run state.
  orchestrate_strategy:
    type: function
    agents: [JVP_AGENT]
  run_daily_ingestion:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Execute the complete daily ingestion pipeline.

        This orchestrates the full E2E flow:
        1. Start ingestion run (Agent 0)
        2. Get active topics (Agent 2)
        3. Harvest all sources (Agent 1)
        4. Score articles (Agent 3)
        5. Filter top articles (Agent 3)
        6. Build brief payload (Agent 4)
        7. Validate articles and brief (Agent 6)
        8. Store articles and brief (Agent 7)
        9. Update ingestion run with final status (Agent 7)

        Args:
            user_id: Optional user ID (defaults to system user)
            trigger: What triggered this run (scheduled, manual, etc.)

        Returns:
            Complete ingestion result with:
            - run_id: Ingestion run ID
            - status: success or failed
            - stats: Counts and metrics
            - brief_id: Generated brief ID
            - errors: Any errors encountered
  start_ingestion_run:
    type: function
    agents: [root_agent.0]
    params:
      description: |-
        Create an ingestion run descriptor.

        Args:
            trigger: A string describing what kicked off the run
                     (e.g., "scheduled", "manual_dashboard").

        Returns:
            A dict with at least:
            - run_id: string
            - started_at: ISO8601 timestamp
            - trigger: original trigger string
  vertex_ai_rag_search:
    type: function
    agents: [JVP_AGENT]

